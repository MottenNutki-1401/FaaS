<!DOCTYPE html>
<html>

<head>

    <title>MiniFaaS</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

    <div class="main-container">

        <!-- LEFT PANEL -->
        <div class="left-panel">

            <h1>MiniFaaS Platform</h1>


            <!-- DEPLOY -->
            <div class="glass-box">

                <h2>Deploy Function</h2>

                <form id="upload-form">

                    <input
                        type="file"
                        name="file"
                        id="file-input"
                    >

                    <button type="submit">

                        Deploy Function

                    </button>

                </form>

            </div>


            <!-- FUNCTIONS -->
            <div class="glass-box">

                <h2>Uploaded Functions</h2>

                <div id="functions-box">

                </div>

            </div>

        </div>


        <!-- RIGHT PANEL -->
        <div class="right-panel">

            <!-- EXECUTION LOGS -->
            <div class="glass-box">

                <h2>Execution Logs</h2>

                <div id="logs-box">

                </div>

            </div>


            <!-- LIVE CONTAINERS -->
            <div class="glass-box">

                <h2>Live Runtime Activity</h2>

                <div id="containers-box">

                </div>

            </div>

        </div>

    </div>


    <script defer>

        //fetch dashboard data
        async function updateDashboard() {

            const response = await fetch(
                "/status"
            )

            const data = await response.json()


            //FUNCTIONS
            const functionsBox =
                document.getElementById(
                    "functions-box"
                )

            functionsBox.innerHTML = ""


            data.files.forEach(file => {

                const isRunning =
                    data.running.includes(file)

                functionsBox.innerHTML += `

                    <div class="function-card">

                        <div>

                            <b>${file}</b>

                            <br>

                            ${
                                isRunning

                                ? "<span class='running'>RUNNING</span>"

                                : "<span class='idle'>IDLE</span>"
                            }

                        </div>

                        <button
                            onclick="executeFunction('${file}')"
                        >

                            Execute

                        </button>

                    </div>

                `
            })


            //LOGS
            const logsBox =
                document.getElementById(
                    "logs-box"
                )

            logsBox.innerHTML = ""


            if (data.logs.length === 0) {

                logsBox.innerHTML =
                    "<p>No executions yet...</p>"
            }


            data.logs.forEach(log => {

                logsBox.innerHTML += `

                    <div class="log-card">

                        <p>
                            <b>Function:</b>
                            ${log.function}
                        </p>

                        <p>
                            <b>Status:</b>
                            ${log.returncode}
                        </p>

                        <p>
                            <b>Output:</b>
                            ${log.stdout}
                        </p>

                        <p>
                            <b>Error:</b>
                            ${log.stderr}
                        </p>

                    </div>

                `
            })


            //LIVE RUNTIME EVENTS
            const containersBox =
                document.getElementById(
                    "containers-box"
                )

            containersBox.innerHTML = ""


            if (data.events.length === 0) {

                containersBox.innerHTML =
                    "<p>No runtime activity yet...</p>"
            }


            data.events.forEach(event => {

                containersBox.innerHTML += `

                    <div class="container-card">

                        <p>
                            <b>Container:</b>
                            ${event.container}
                        </p>

                        <p>
                            <b>Runtime:</b>
                            ${event.runtime}
                        </p>

                        <p>
                            <b>Status:</b>

                            ${
                                event.status === "RUNNING"

                                ? "<span class='running'>RUNNING</span>"

                                : "<span class='destroyed'>DESTROYED</span>"
                            }

                        </p>

                    </div>

                `
            })
        }


        //execute function without reload
        async function executeFunction(filename) {

            await fetch(
                `/execute/${filename}`
            )

            updateDashboard()
        }


        //upload function without reload
        document.getElementById(
            "upload-form"
        ).addEventListener(

            "submit",

            async function(event) {

                event.preventDefault()

                const formData = new FormData()

                const fileInput =
                    document.getElementById(
                        "file-input"
                    )

                formData.append(
                    "file",
                    fileInput.files[0]
                )

                await fetch("/deploy", {

                    method: "POST",

                    body: formData
                })

                updateDashboard()
            }
        )


        //refresh dashboard every second
        setInterval(
            updateDashboard,
            1000
        )


        //initial load
        updateDashboard()

    </script>

</body>

</html>
